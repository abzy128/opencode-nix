name: Build and Cache

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - uses: cachix/cachix-action@v17
        if: github.ref == 'refs/heads/dev'
        with:
          name: opencode-ai
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build opencode
        run: nix build .#opencode --print-build-logs

      - name: Test opencode
        run: |
          ./result/bin/opencode --version
          ./result/bin/opencode --help >/dev/null

      - name: Push to Cachix
        if: github.ref == 'refs/heads/dev'
        run: nix build .#opencode --json | jq -r '.[].outputs.out' | cachix push opencode-ai
